name: Release

# Push a tag like v0.1.0 to build the Windows installer and publish it as a GitHub Release.
# Installed copies find it through latest.yml on their daily update check.
on:
  push:
    tags: ['v0.*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Why: electron-builder names the release after package.json, so a mismatched tag would publish the wrong version.
      - name: Check tag matches package.json version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: |
          pnpm run build:desktop
          pnpm run build:native
          pnpm run ensure:electron-runtime

      - name: Package and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec electron-builder --config config/electron-builder.config.cjs --win --publish always

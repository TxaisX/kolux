# TEMPORARY (PR #253), deleted before the PR is finished. On GitHub's windows-latest runner:
# - measure: counts console-host (conhost.exe) starts during one full `cargo test` on wave-1 and on
#   this branch (WMI process-start trace, cross-checked against Security event 4688).
# - repeat: one test failed once in a full cargo test on the owner's PC and its name was not kept.
#   This repeats the likely candidates on wave-1, on this branch before its activity.rs timing fix
#   and on this branch's head, interleaved on one runner: each test alone (quiet, then with every
#   core kept busy), and the activity and status tests together (they share two locks, as in the
#   full run). Read-only: no secrets, nothing published.
name: tmp console hosts

on:
  pull_request:

permissions:
  contents: read

jobs:
  measure:
    name: Console hosts on ${{ matrix.side }}
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        side: [wave-1, branch]
    env:
      SIDE: ${{ matrix.side }}
      WAVE1: 82f3643e7635cece4f9220c49b7d0101174cfa67
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check out the measured commit
        shell: pwsh
        run: |
          $sha = if ($env:SIDE -eq 'wave-1') { $env:WAVE1 } else { $env:HEAD_SHA }
          git checkout --detach --force $sha
          git log -1 --format='MEASURED COMMIT %H %s'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: pnpm install --frozen-lockfile
      - name: Build the tests
        working-directory: src-tauri
        shell: pwsh
        run: |
          . ../scripts/test-env.ps1
          rustc --version
          cargo test --locked --no-run
      - name: Full cargo test with a conhost.exe watch
        timeout-minutes: 75
        working-directory: src-tauri
        shell: pwsh
        run: |
          $tmp = $env:RUNNER_TEMP
          $csv = Join-Path $tmp 'starts.csv'
          $stop = Join-Path $tmp 'watch.stop'
          $ready = Join-Path $tmp 'watch.ready'
          $watcher = Join-Path $tmp 'watch.ps1'
          $log = Join-Path $tmp 'full-run.log'
          # The watcher runs in its own pwsh and writes every process start (WMI Win32_ProcessStartTrace,
          # kernel trace, so short-lived processes are not missed) with its parent pid to a CSV.
          @'
          param([string]$Out, [string]$Stop, [string]$Ready)
          Register-CimIndicationEvent -Query 'SELECT * FROM Win32_ProcessStartTrace' -SourceIdentifier kstart | Out-Null
          $w = [System.IO.StreamWriter]::new($Out)
          $w.WriteLine('ticks,name,pid,ppid')
          Set-Content -Path $Ready -Value 'ready'
          $until = $null
          while ($true) {
            $null = Wait-Event -SourceIdentifier kstart -Timeout 1
            foreach ($e in @(Get-Event -SourceIdentifier kstart -ErrorAction SilentlyContinue)) {
              $n = $e.SourceEventArgs.NewEvent
              $t = $n.TIME_CREATED
              if (-not $t) { $t = $e.TimeGenerated.ToUniversalTime().ToFileTimeUtc() }
              $w.WriteLine(('{0},{1},{2},{3}' -f $t, $n.ProcessName, $n.ProcessID, $n.ParentProcessID))
              Remove-Event -EventIdentifier $e.EventIdentifier
            }
            $w.Flush()
            if (-not $until -and (Test-Path $Stop)) { $until = (Get-Date).AddSeconds(10) }
            if ($until -and (Get-Date) -gt $until) { break }
          }
          $w.Close()
          '@ | Set-Content -Path $watcher
          # Cross-check from the kernel's own record: Security event 4688 (process creation).
          auditpol /set /subcategory:"{0CCE922B-69AE-11D9-BED3-505054503030}" /success:enable
          wevtutil sl Security /ms:1073741824
          Add-Type -Namespace K -Name Con -MemberDefinition '[DllImport("kernel32.dll")] public static extern uint GetConsoleProcessList(uint[] ids, uint n);'
          $ids = [uint32[]]::new(64)
          "CONSOLE this step shares a console with $([K.Con]::GetConsoleProcessList($ids, 64)) process(es) (0 = no console)"
          $wp = Start-Process pwsh -ArgumentList '-NoProfile', '-File', $watcher, '-Out', $csv, '-Stop', $stop, '-Ready', $ready -PassThru -WindowStyle Hidden
          $deadline = (Get-Date).AddSeconds(90)
          while (-not (Test-Path $ready) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 200 }
          if (-not (Test-Path $ready)) { 'RESULT the WMI watcher did not start; counts below are empty' }
          Start-Sleep -Seconds 5
          # PowerShell names are case-blind: the times and their FILETIME ticks need different names.
          $idleFrom = [DateTime]::UtcNow; Start-Sleep -Seconds 60; $idleTo = [DateTime]::UtcNow
          . ../scripts/test-env.ps1
          $runFrom = [DateTime]::UtcNow
          cargo test --locked --no-fail-fast 2>&1 | Tee-Object -FilePath $log
          $rc = $LASTEXITCODE
          $runTo = [DateTime]::UtcNow
          New-Item -ItemType File -Path $stop | Out-Null
          $null = $wp.WaitForExit(300000)
          $rows = if (Test-Path $csv) { @(Import-Csv $csv) } else { @() }
          $idleA = [uint64]$idleFrom.ToFileTimeUtc(); $idleB = [uint64]$idleTo.ToFileTimeUtc()
          $runA = [uint64]$runFrom.ToFileTimeUtc(); $runB = [uint64]$runTo.ToFileTimeUtc()
          $idle = @($rows | Where-Object { $_.name -ieq 'conhost.exe' -and [uint64]$_.ticks -ge $idleA -and [uint64]$_.ticks -lt $idleB }).Count
          $win = $rows | Where-Object { [uint64]$_.ticks -ge $runA -and [uint64]$_.ticks -le $runB } | Sort-Object { [uint64]$_.ticks }
          # Descendants of this step's shell (cargo, the test binaries and every child they start), in
          # start order; a pid reused by an unrelated process leaves the tree.
          $tree = [System.Collections.Generic.HashSet[int]]::new(); [void]$tree.Add($PID)
          $names = @{}
          $by = @{}
          $all = 0; $allT = 0; $con = 0; $conT = 0; $git = 0; $gitT = 0
          foreach ($r in $win) {
            $p = [int]$r.pid; $pp = [int]$r.ppid
            $in = $tree.Contains($pp)
            if ($in) { [void]$tree.Add($p) } else { [void]$tree.Remove($p) }
            $all++; if ($in) { $allT++ }
            if ($r.name -ieq 'git.exe') { $git++; if ($in) { $gitT++ } }
            if ($r.name -ieq 'conhost.exe') {
              $con++
              if ($in) {
                $conT++
                $parent = if ($names.ContainsKey($pp)) { $names[$pp] } else { 'step shell' }
                # WMI gives the kernel's 15-character image name; a test binary's hash suffix is cut short.
                $parent = $parent -replace '-[0-9a-f]+(\.exe)?$', '-<hash>'
                $by[$parent] = 1 + [int]$by[$parent]
              }
            }
            $names[$p] = $r.name
          }
          try {
            $from = $runFrom.ToString('yyyy-MM-ddTHH:mm:ss.fffZ'); $to = $runTo.ToString('yyyy-MM-ddTHH:mm:ss.fffZ')
            $xp = "*[System[(EventID=4688) and TimeCreated[@SystemTime>='$from' and @SystemTime<='$to']]]"
            $ev = @(Get-WinEvent -LogName Security -FilterXPath $xp -ErrorAction Stop)
            $audit = "$(@($ev | Where-Object { "$($_.Properties[5].Value)" -like '*\conhost.exe' }).Count) conhost.exe and $(@($ev | Where-Object { "$($_.Properties[5].Value)" -like '*\git.exe' }).Count) git.exe of $($ev.Count) process creations"
          } catch { $audit = "not available: $($_.Exception.Message)" }
          $tests = Select-String -Path $log -Pattern '^test result:' | ForEach-Object { $_.Line }
          $summary = @(
            "RESULT side=$env:SIDE commit=$(git rev-parse HEAD) date=$($runFrom.ToString('yyyy-MM-dd')) from=$($runFrom.ToString('HH:mm:ss'))Z to=$($runTo.ToString('HH:mm:ss'))Z",
            "RESULT cargo test exit $rc, wall $([int]($runTo - $runFrom).TotalSeconds) s",
            "RESULT conhost.exe starts during the run (WMI): $con total, $conT from the cargo test process tree",
            "RESULT conhost.exe starts in a 60 s idle sample before the run: $idle",
            "RESULT process starts during the run: $all total, $allT in the cargo test tree; git.exe $git total, $gitT in the tree",
            "RESULT Security 4688 cross-check during the run: $audit",
            "RESULT conhost parents in the tree: $(($by.GetEnumerator() | Sort-Object Value -Descending | ForEach-Object { "$($_.Key)=$($_.Value)" }) -join ', ')"
          ) + ($tests | ForEach-Object { "RESULT $_" })
          $summary | Out-Host
          $summary | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          $failed = @(Select-String -Path $log -Pattern '^test (\S+) \.\.\. FAILED' | ForEach-Object { $_.Matches[0].Groups[1].Value })
          "RESULT failing tests: $(if ($failed.Count) { $failed -join '; ' } else { 'none' })" | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY

  repeat:
    name: Candidate tests on three commits
    runs-on: windows-latest
    timeout-minutes: 170
    env:
      WAVE1: 82f3643e7635cece4f9220c49b7d0101174cfa67
      PREFIX: 7039a898b779b8812daaa40e46e5535b3cc83022
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Build each commit's lib tests
        shell: pwsh
        run: |
          # One worktree per commit (each test binary keeps its own source folder), one shared target
          # folder for the dependencies; each binary is copied out because all three get the same name.
          $bin = Join-Path $env:RUNNER_TEMP 'bin'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'target'
          $sides = [ordered]@{ 'wave-1' = $env:WAVE1; 'pre-fix' = $env:PREFIX; 'head' = $env:HEAD_SHA }
          foreach ($k in $sides.Keys) {
            $wt = Join-Path $env:RUNNER_TEMP "wt-$k"
            git worktree add --detach $wt $sides[$k]
            Push-Location (Join-Path $wt 'src-tauri')
            rustc --version
            $exe = $null
            cargo test --locked --lib --no-run --message-format=json | ForEach-Object {
              if ($_ -like '{*') {
                $j = $_ | ConvertFrom-Json
                if ($j.reason -eq 'compiler-artifact' -and $j.target.name -eq 'kolux_lib' -and $j.profile.test -and $j.executable) { $exe = $j.executable }
              }
            }
            if (-not $exe) { throw "no lib test binary for $k" }
            Copy-Item $exe (Join-Path $bin "kolux_lib-$k.exe")
            "BUILT $k $($sides[$k]) from $exe"
            Pop-Location
          }
      - name: Repeat the candidates
        timeout-minutes: 100
        shell: pwsh
        run: |
          . ./scripts/test-env.ps1
          $bin = Join-Path $env:RUNNER_TEMP 'bin'
          $sides = [ordered]@{ 'wave-1' = $env:WAVE1; 'pre-fix' = $env:PREFIX; 'head' = $env:HEAD_SHA }
          $T067 = 'activity::tests::t067b_a_lost_service_connection_ends_the_open_turn_of_each_pane_it_carried_once'
          # name, runs per round: the timing-sensitive test this branch changed, a status test that
          # flaked under load on Linux, and the tests whose children's console this branch changed.
          $cands = @(
            @($T067, 5),
            @('status::tests::p81_a_deny_settle_sets_a_waiting_child_aside_and_both_readings_say_interrupted', 2),
            @('winproc::tests::t816_command_hides_its_console_on_windows', 1),
            @('winproc::tests::no_window_shares_an_existing_console_and_hides_a_new_one', 1),
            @('procs::tests::term045_a_process_running_a_child_has_children_and_the_child_has_none', 1),
            @('procs::tests::orch058_kill_tree_ends_a_shell_and_the_program_it_started', 1),
            @('auto_pr::tests::t652_a_command_with_input_outlives_its_limit_or_answers', 1),
            @('git::tests::git070_a_hung_short_read_is_stopped_at_its_limit_and_the_next_read_runs', 1),
            @('git::tests::proj027_a_git_that_stalls_is_stopped_with_a_message_naming_the_wait_and_the_cause', 1),
            @('git::tests::an_unattended_git_fails_fast_on_a_remote_that_wants_a_password', 1)
          )
          function Invoke-Bin([string]$side, [string[]]$a, [int]$ms) {
            $psi = [System.Diagnostics.ProcessStartInfo]::new((Join-Path $bin "kolux_lib-$side.exe"))
            foreach ($x in $a) { $psi.ArgumentList.Add($x) }
            $psi.WorkingDirectory = Join-Path $env:RUNNER_TEMP "wt-$side\src-tauri"
            $psi.UseShellExecute = $false
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $p = [System.Diagnostics.Process]::Start($psi)
            $o = $p.StandardOutput.ReadToEndAsync(); $e = $p.StandardError.ReadToEndAsync()
            if (-not $p.WaitForExit($ms)) {
              try { $p.Kill($true) } catch {}
              $null = $p.WaitForExit(10000)
              return [pscustomobject]@{ code = 'timeout'; out = '' }
            }
            $p.WaitForExit()
            [pscustomobject]@{ code = $p.ExitCode; out = $o.Result + $e.Result }
          }
          $has = @{}
          foreach ($k in $sides.Keys) {
            $list = @(& (Join-Path $bin "kolux_lib-$k.exe") --list 2>$null | Where-Object { $_ -like '*: test' } | ForEach-Object { $_ -replace ': test$', '' })
            $has[$k] = [System.Collections.Generic.HashSet[string]]::new([string[]]$list)
            "LIST $k $($sides[$k]) has $($has[$k].Count) tests"
          }
          $count = [ordered]@{}
          $shown = @{}
          function Note([string]$key, [string]$what, [string]$out) {
            if (-not $count.Contains($key)) { $count[$key] = [ordered]@{ pass = 0; fail = 0; timeout = 0 } }
            $count[$key][$what]++
            if ($what -ne 'pass' -and [int]$shown[$key] -lt 2) {
              $shown[$key] = 1 + [int]$shown[$key]
              "---- $what in $key ----"
              (($out -split "`n") | Select-Object -Last 40) -join "`n"
            }
          }
          function Burn { 1..(2 * [Environment]::ProcessorCount) | ForEach-Object { Start-Process pwsh -ArgumentList '-NoProfile -Command "for (;;) {}"' -PassThru -WindowStyle Hidden } }
          function Report([string]$phase) {
            $lines = foreach ($key in @($count.Keys | Where-Object { $_ -like "$phase|*" })) {
              $c = $count[$key]
              "RESULT $key : $($c.pass) passed, $($c.fail) failed, $($c.timeout) timed out"
            }
            $lines | Out-Host
            $lines | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          }
          # Alone: each candidate by itself, the three commits back to back for each one.
          function Alone([string]$phase, [double]$minutes) {
            $until = (Get-Date).AddMinutes($minutes); $rounds = 0
            while ((Get-Date) -lt $until) {
              $rounds++
              foreach ($c in $cands) {
                foreach ($k in $sides.Keys) {
                  if (-not $has[$k].Contains($c[0])) { continue }
                  for ($i = 0; $i -lt $c[1]; $i++) {
                    $r = Invoke-Bin $k @($c[0], '--exact') 180000
                    $what = if ($r.code -eq 'timeout') { 'timeout' } elseif ($r.code -eq 0 -and $r.out -match 'test result: ok\. 1 passed') { 'pass' } else { 'fail' }
                    Note "$phase|$k|$($c[0])" $what $r.out
                  }
                }
              }
            }
            "RESULT $phase finished $rounds rounds"
            Report $phase
          }
          # Together: the activity and status tests in one run (libtest's threads), as the full run has them.
          function Together([string]$phase, [double]$minutes) {
            $until = (Get-Date).AddMinutes($minutes); $rounds = 0
            while ((Get-Date) -lt $until) {
              $rounds++
              foreach ($k in $sides.Keys) {
                $r = Invoke-Bin $k @('activity::', 'status::') 300000
                $what = if ($r.code -eq 'timeout') { 'timeout' } elseif ($r.out -match "(?m)^test $([regex]::Escape($T067)) \.\.\. ok") { 'pass' } else { 'fail' }
                Note "$phase|$k|$T067" $what $r.out
                foreach ($m in [regex]::Matches($r.out, '(?m)^test (\S+) \.\.\. FAILED')) {
                  $n = $m.Groups[1].Value
                  if ($n -ne $T067) { Note "$phase|$k|other failure $n" 'fail' $r.out }
                }
              }
            }
            "RESULT $phase finished $rounds rounds"
            Report $phase
          }
          $b = Burn
          try { Together 'together-busy' 12 } finally { $b | Stop-Process -Force -ErrorAction SilentlyContinue }
          Alone 'alone-quiet' 15
          $b = Burn
          try { Alone 'alone-busy' 12 } finally { $b | Stop-Process -Force -ErrorAction SilentlyContinue }
          Together 'together-quiet' 6

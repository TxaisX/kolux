# TEMPORARY (PR #252; deleted again before the PR is finished). Runs the two live checks that need real Windows on
# GitHub's windows-latest runner: a pane drawn by the Windows Terminal engine in the dark and the light Kolux look
# (scripts/prove/live-native-look.mjs) and "new terminal" with the kept-warm shell off and on
# (scripts/prove/live-warm-shell.mjs). Screenshots, timings and logs are uploaded even when a check fails.
# Numbers from here are the runner's, not the owner's PC.
#
# Third pass. In the first two runs the app started and drew its window, but nothing listened on the debugging port:
# the watcher showed this runner's WebView2 (156.0.4314.58) starting the web view with only the arguments the app
# passes, ignoring WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS and the same flag as a WebView2 policy, while a plain Edge
# answered on the same port at once. PROVE_CDP_IN_CONFIG=1 now puts the port in the window config the check compiles
# in (scripts/evidence/app-launch.mjs). The watcher beside each check stays, so a page that never comes says why.
name: Temporary native pane evidence

on:
  push:
    branches: [fu/native-style]

permissions:
  contents: read

concurrency:
  group: tmp-native-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    name: Native pane shots and new-terminal timings (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - name: Screen size and session
        shell: pwsh
        continue-on-error: true
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { "Set-DisplayResolution: $_" }
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          [System.Environment]::OSVersion.VersionString
          "step session $([System.Diagnostics.Process]::GetCurrentProcess().SessionId), interactive $([Environment]::UserInteractive), user $(whoami)"
          query user 2>&1
          exit 0
      - name: Pick a debugging port outside the reserved ranges
        shell: pwsh
        run: |
          $ex = netsh int ipv4 show excludedportrange protocol=tcp | Out-String
          $ex
          netsh int ipv4 show dynamicport tcp
          $ranges = [regex]::Matches($ex, '(?m)^\s*(\d+)\s+(\d+)') | ForEach-Object { , @([int]$_.Groups[1].Value, [int]$_.Groups[2].Value) }
          $pick = $null
          foreach ($p in 9290, 9222, 19290, 29290, 39290) {
            $reserved = @($ranges | Where-Object { $p -ge $_[0] -and $p -le $_[1] }).Count -gt 0
            $busy = $null -ne (Get-NetTCPConnection -LocalPort $p -ErrorAction SilentlyContinue)
            "port $p reserved $reserved busy $busy"
            if (-not $reserved -and -not $busy) { $pick = $p; break }
          }
          if (-not $pick) { throw 'no free debugging port' }
          "PROVE_CDP=$pick" >> $env:GITHUB_ENV
          "debugging port $pick"
      - name: Does a plain Edge answer on that port?
        shell: pwsh
        continue-on-error: true
        run: |
          $wv = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          "WebView2 runtime $((Get-ItemProperty $wv -ErrorAction SilentlyContinue).pv)"
          foreach ($root in 'HKLM:\SOFTWARE\Policies\Microsoft', 'HKCU:\SOFTWARE\Policies\Microsoft') {
            Get-ChildItem $root -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Name -match 'Edge|WebView' } | ForEach-Object { $k = $_; $k.GetValueNames() | ForEach-Object { "policy $($k.Name)\$_ = $($k.GetValue($_))" } }
          }
          $edge = @("${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe", "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          "edge $edge"
          $udd = Join-Path $env:RUNNER_TEMP 'edge-smoke'
          Start-Process $edge -ArgumentList "--remote-debugging-port=$env:PROVE_CDP", "--user-data-dir=$udd", '--no-first-run', '--no-default-browser-check', 'about:blank' | Out-Null
          $ok = $false
          for ($i = 1; $i -le 30 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            try { $v = Invoke-WebRequest "http://127.0.0.1:$env:PROVE_CDP/json/version" -UseBasicParsing -TimeoutSec 2; "Edge answered after $i s: $($v.Content -replace '\s+', ' ')"; $ok = $true } catch { }
          }
          if (-not $ok) { 'Edge never answered on the debugging port in 30 s' }
          Get-CimInstance Win32_Process -Filter "Name='msedge.exe'" | Where-Object { $_.CommandLine -like "*$udd*" } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 2
      - name: Fetch the Windows Terminal engine (NuGet CI.Microsoft.Terminal.Wpf 1.25.260303002, MIT, not committed)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'wt-engine'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $zip = Join-Path $dir 'pkg.zip'
          Invoke-WebRequest -Uri 'https://www.nuget.org/api/v2/package/CI.Microsoft.Terminal.Wpf/1.25.260303002' -OutFile $zip
          Expand-Archive $zip -DestinationPath (Join-Path $dir 'x') -Force
          $dll = Join-Path $dir 'x\runtimes\win-x64\native\Microsoft.Terminal.Control.dll'
          if (-not (Test-Path $dll)) { Get-ChildItem -Recurse (Join-Path $dir 'x') -Filter *.dll | ForEach-Object FullName; throw 'no win-x64 Microsoft.Terminal.Control.dll in the package' }
          Get-Item $dll | Format-List FullName, Length
          "sha256 $((Get-FileHash $dll -Algorithm SHA256).Hash)"
          "signature $((Get-AuthenticodeSignature $dll).Status)"
          "NATIVE_TERMINAL_DLL=$dll" >> $env:GITHUB_ENV
      - name: Write the watcher that runs beside each live check
        shell: pwsh
        run: |
          $watch = @'
          param([string]$logs, [string]$cdp, [string]$tag, [int]$minutes)
          New-Item -ItemType Directory -Force $logs | Out-Null
          $out = Join-Path $logs "watch-$tag.txt"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot([string]$name) {
            try {
              $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size); $g.Dispose()
              $bmp.Save((Join-Path $logs "$name.png"), [System.Drawing.Imaging.ImageFormat]::Png); $bmp.Dispose(); "screen saved as $name.png"
            } catch { "screen capture $name failed: $($_.Exception.Message)" }
          }
          "watcher session $([System.Diagnostics.Process]::GetCurrentProcess().SessionId), interactive $([Environment]::UserInteractive)" | Add-Content $out
          $end = (Get-Date).AddMinutes($minutes)
          $n = 0
          while ((Get-Date) -lt $end) {
            $n++
            $o = [System.Collections.Generic.List[string]]::new()
            $o.Add("== $(Get-Date -Format HH:mm:ss) sample $n")
            foreach ($k in Get-CimInstance Win32_Process -Filter "Name='kolux.exe'") {
              $gp = Get-Process -Id $k.ProcessId -ErrorAction SilentlyContinue
              $o.Add("kolux.exe pid $($k.ProcessId) session $($k.SessionId) window $($gp.MainWindowHandle) title '$($gp.MainWindowTitle)'")
            }
            $wv = @(Get-CimInstance Win32_Process -Filter "Name='msedgewebview2.exe'")
            $o.Add("msedgewebview2.exe x$($wv.Count)")
            foreach ($w in $wv | Where-Object { $_.CommandLine -notmatch '--type=' }) {
              $c = [string]$w.CommandLine
              $o.Add("  browser pid $($w.ProcessId) parent $($w.ParentProcessId) session $($w.SessionId): $($c.Substring(0, [Math]::Min(900, $c.Length)))")
            }
            foreach ($l in Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { $_.LocalPort -in @([int]$cdp, 1470) }) {
              $o.Add("listening $($l.LocalAddress):$($l.LocalPort) pid $($l.OwningProcess)")
            }
            try { $j = (Invoke-WebRequest "http://127.0.0.1:$cdp/json" -UseBasicParsing -TimeoutSec 3).Content -replace '\s+', ' '; $o.Add("port $cdp /json: $($j.Substring(0, [Math]::Min(700, $j.Length)))") } catch { $o.Add("port $cdp /json: $($_.Exception.Message)") }
            foreach ($f in Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP 'live'), (Join-Path $env:LOCALAPPDATA 'com.txaisxiong.kolux.prove') -Recurse -Filter DevToolsActivePort -ErrorAction SilentlyContinue) {
              $o.Add("DevToolsActivePort $($f.FullName): $((Get-Content $f.FullName -ErrorAction SilentlyContinue) -join ' ')")
            }
            if ($n % 8 -eq 0) { $o.Add((Shot "watch-$tag-$n")) }
            $o | Add-Content $out
            Start-Sleep -Seconds 15
          }
          '@
          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'watch.ps1') -Value $watch
      - name: Build the debug app once (the live checks start it with pnpm tauri dev)
        working-directory: src-tauri
        run: cargo build --locked
      - name: New terminal with the kept-warm shell off, then on (5 runs each)
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 25
        run: |
          $env:PROVE_BASE = Join-Path $env:RUNNER_TEMP 'live'
          $env:PROVE_LOGS = Join-Path $env:RUNNER_TEMP 'live-logs'
          $env:PROVE_NO_EVIDENCE = '1'
          $env:PROVE_BUILD_MINUTES = '8'
          $env:PROVE_CDP_IN_CONFIG = '1'
          $job = Start-Job -FilePath (Join-Path $env:RUNNER_TEMP 'watch.ps1') -ArgumentList $env:PROVE_LOGS, $env:PROVE_CDP, 'WARM', 12
          node scripts/prove/live-warm-shell.mjs
          "exit $LASTEXITCODE"
          Stop-Job $job -ErrorAction SilentlyContinue
      - name: Close anything the first check left running
        shell: pwsh
        continue-on-error: true
        run: |
          Get-CimInstance Win32_Process -Filter "Name='kolux.exe'" | ForEach-Object { "stopping kolux.exe $($_.ProcessId)"; Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Get-NetTCPConnection -State Listen -LocalPort 1470 -ErrorAction SilentlyContinue | ForEach-Object { "stopping the dev server $($_.OwningProcess)"; Stop-Process -Id $_.OwningProcess -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 3
      - name: A native pane in the dark and the light look
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 15
        run: |
          $env:PROVE_BASE = Join-Path $env:RUNNER_TEMP 'live'
          $env:PROVE_LOGS = Join-Path $env:RUNNER_TEMP 'live-logs'
          $env:PROVE_NO_EVIDENCE = '1'
          $env:PROVE_BUILD_MINUTES = '6'
          $env:PROVE_CDP_IN_CONFIG = '1'
          $env:NATIVE_ON_SCREEN = '1'
          $job = Start-Job -FilePath (Join-Path $env:RUNNER_TEMP 'watch.ps1') -ArgumentList $env:PROVE_LOGS, $env:PROVE_CDP, 'NATIVE', 8
          node scripts/prove/live-native-look.mjs
          "exit $LASTEXITCODE"
          Stop-Job $job -ErrorAction SilentlyContinue
      - name: Upload screenshots, timings and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-evidence
          path: |
            ${{ runner.temp }}/live-logs
            ${{ runner.temp }}/live/run-*/*.log
          if-no-files-found: warn

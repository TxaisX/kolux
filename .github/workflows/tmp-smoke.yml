# TEMPORARY (PR #255; deleted again before the PR is finished). Runs the project's own smoke test
# (scripts/evidence/smoke.mjs, flows 1-7) against the real app window on GitHub's windows-latest runner, on this branch
# after it took in wave-1 with #253, #252 and #254: the combined UI (one session per cell, the folders-only sidebar, the
# src/ui menus, the native-style work, the test consoles) driven over the app's own WebView2 debugging port. The smoke's
# report and the app's logs are uploaded even when a flow fails. Numbers from here are the runner's, not the owner's PC.
name: Temporary smoke in the real window

on:
  push:
    branches: [fu/clean-tabs]

permissions:
  contents: read

concurrency:
  group: tmp-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke flows in the app window (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - name: Screen size
        shell: pwsh
        continue-on-error: true
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { "Set-DisplayResolution: $_" }
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          [System.Environment]::OSVersion.VersionString
      - name: Put the debugging port in the window config (this run only; the checkout is thrown away)
        shell: pwsh
        run: |
          # The runner's WebView2 ignores WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS (seen in PR #252), so nothing would
          # listen on the smoke's port. The app hands a window's additionalBrowserArgs to the web view in place of its
          # base flags, so they lead.
          $path = 'src-tauri/tauri.conf.json'
          $conf = Get-Content $path -Raw | ConvertFrom-Json
          foreach ($w in $conf.app.windows) { $w | Add-Member -Force additionalBrowserArgs '--disable-features=msWebOOUI,msPdfOOUI --remote-debugging-port=9240' }
          $conf | ConvertTo-Json -Depth 32 | Set-Content $path -Encoding utf8
          (Get-Content $path -Raw | ConvertFrom-Json).app.windows | Format-List
      - name: Build the debug app once (the smoke starts it with pnpm tauri dev)
        working-directory: src-tauri
        run: cargo build --locked
      - name: Smoke, flows 1-7
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 60
        run: |
          node scripts/evidence/smoke.mjs --temp (Join-Path $env:RUNNER_TEMP 'smoke') --timeout 30
          "exit $LASTEXITCODE"
      - name: Upload the smoke report and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke
          path: |
            evidence/smoke-*.txt
            ${{ runner.temp }}/smoke/*.log
            ${{ runner.temp }}/smoke/marks/**
          if-no-files-found: warn

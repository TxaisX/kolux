# cargo-about policy for the Rust half of THIRD-PARTY-NOTICES.txt (T-783). The allowed list is the one deny.toml
# enforces (LOOP.md section 0); scripts/notices.mjs runs cargo-about with this file and the template beside it.
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
]
# Only what ships in the Windows app: Kolux's own crate is private, and build or test tooling is not redistributed.
private = { ignore = true }
ignore-build-dependencies = true
ignore-dev-dependencies = true
targets = ["x86_64-pc-windows-msvc"]

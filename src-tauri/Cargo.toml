[package]
name = "kolux-rs"
version = "0.1.0"
description = "Kolux: run many AI coding agents side by side"
authors = ["Txais Xiong"]
license-file = "../LICENSE"
publish = false
edition = "2021"
# File::try_lock (the skill lock, SKILL-022) is stable from Rust 1.89.
rust-version = "1.90"
default-run = "kolux-rs"

[lib]
name = "kolux_rs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "kolux-dev"
path = "src/bin/kolux-dev.rs"

# CLI-006: the shipped command line. Only the release script builds it, so a development build
# never puts a `kolux` on its panes' search path that would stand in for the installed one.
[[bin]]
name = "kolux"
path = "src/bin/kolux.rs"
required-features = ["release-cli"]

[features]
release-cli = []
# APP-008 / T-248-d: the real tray icon (Open Kolux, Quit, the attention dot); on by default.
tray = ["tauri/tray-icon"]
default = ["tray"]
# Test-only constructors for integration tests (Terminals::fake_session, PtySession::fake); never in a release build.
test-fakes = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Codex keeps its trust in config.toml; edits must leave the rest of the file byte for byte.
toml_edit = "0.25"
rusqlite = { version = "0.37", features = ["bundled"] }
portable-pty = "0.9"
base64 = "0.23"
tauri-plugin-dialog = "2"
# USAGE-009: usage alerts are system notifications, sent from the Rust side.
tauri-plugin-notification = "2"
# AUTO-001: timetables are worked out in the IANA zone saved with an automation (already in the tree via tauri).
jiff = "0.2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
trash = "5"
# Already in the build through the updater; fetches CDN scripts for offline artifacts (SKILL-035).
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "system-proxy"] }
unicode_names2 = "4.0.0"
# SKILL-013: the README lists SHA-256 hashes (sha2 is already in the tree).
sha2 = "0.10"
# T-156-b (SAFE-016): the user's own regular-expression rules, built with a size limit (already in the tree).
regex = "1"

[target.'cfg(unix)'.dependencies]
# T-624: O_NOFOLLOW when the artifact scan opens a source file (already in the tree through std's own dependencies).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_System_Threading", "Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# T-158 / T-251 / T-272-d: WebView2's own events and calls (certificate errors, page capture, PDF
# printing, real key presses). Exact pins of the versions wry already builds, with only features
# wry already turns on, so Cargo.lock gains no crate (coordinator decision 2026-10-20).
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }

[dev-dependencies]
# Integration tests reach the test-only fakes without a flag; a release build never sees dev-dependencies.
kolux-rs = { path = ".", features = ["test-fakes"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
